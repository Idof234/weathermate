services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weathermate
      POSTGRES_USER: weathermate
      POSTGRES_PASSWORD: weathermate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathermate"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/weathermate
    ports:
      - "8080:8080"

volumes:
  pgdata:
